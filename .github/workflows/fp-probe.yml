name: FreedomPay probe

# Разовая диагностика настройки оплаты. Секретный ключ сюда не попадает:
# подпись посчитана заранее, а подпись — не секрет, она уходит в каждом
# обычном запросе. Денег ничто не двигает: это только выдача ссылки.
on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Номер магазина существует? (подпись заведомо неверная)
        run: |
          curl -sS -m 30 -w '\n[http=%{http_code}]\n' \
            -X POST 'https://api.freedompay.kz/init_payment.php' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            --data 'pg_merchant_id=589160&pg_order_id=probe0&pg_amount=100&pg_description=probe&pg_salt=probe&pg_sig=00000000000000000000000000000000'

      - name: Настоящий запрос ссылки на оплату — боевой шлюз
        run: |
          curl -sS -m 30 -w '\n[http=%{http_code}]\n' \
            -X POST 'https://api.freedompay.kz/init_payment.php' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            --data 'pg_merchant_id=589160&pg_order_id=probe-1788493084875&pg_amount=15000&pg_currency=KZT&pg_description=LogiCore%2C+%D0%BF%D1%80%D0%BE%D0%B2%D0%B5%D1%80%D0%BA%D0%B0+%D0%BD%D0%B0%D1%81%D1%82%D1%80%D0%BE%D0%B9%D0%BA%D0%B8&pg_salt=jm2pqs0sgk&pg_lifetime=3600&pg_result_url=https%3A%2F%2Fapi.logicore.kz%2Fbilling%2Ffreedompay%2Fresult&pg_check_url=https%3A%2F%2Fapi.logicore.kz%2Fbilling%2Ffreedompay%2Fcheck&pg_success_url=https%3A%2F%2Flogicore.kz%2Fbilling%2Fpayment%2Fprobe&pg_failure_url=https%3A%2F%2Flogicore.kz%2Fbilling%2Fpayment%2Fprobe%3Ffailed%3D1&pg_language=ru&pg_testing_mode=1&pg_sig=807b14d43a049f9a373bf05c0c244ab0'
