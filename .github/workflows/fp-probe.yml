name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Тестовые карты со страницы документации
        run: |
          curl -sSL -m 60 "https://freedompay.kz/docs/merchant-api/pay" -o p.html
          echo "=== номера карт, найденные на странице ==="
          tr -s '<>' '\n\n' < p.html | grep -oE '[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}' | sort -u | head -40
          echo
          echo "=== окрестности слова «Тестовые карты» ==="
          tr -s '<>' '\n\n' < p.html | grep -n -i -A 40 'Тестовые карты' | head -80

      - name: Справочник кодов ошибок целиком
        run: |
          curl -sSL -m 60 "https://freedompay.kz/docs/gateway-api/error-list" -o e.html
          tr -s '<>' '\n\n' < e.html | sed '/^\s*$/d' | grep -vE '^(div|span|p|a|img|br|/|!|meta|link|script|style|button|li|ul|h[1-6])' | head -200
