name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Официальный справочник ошибок
        run: |
          curl -sSL -m 40 'https://customer.freedompay.kz/dev/error' -o err.html
          echo "байт: $(wc -c < err.html)"
          tr -s '<>' '\n\n' < err.html | grep -B2 -A2 -E '10005|10009|10001' | head -40

      - name: Какие методы оплаты доступны магазину в тесте
        run: |
          for pair in \
            "get_payment_methods.php|pg_merchant_id=589160&pg_amount=5000&pg_currency=KZT&pg_testing_mode=1&pg_salt=lx5v0fbsrme&pg_sig=3e37286c1c5d7019a2939cba5d8416c5" \
            "payment_methods.php|pg_merchant_id=589160&pg_amount=5000&pg_currency=KZT&pg_testing_mode=1&pg_salt=qvf2f6nesul&pg_sig=744d07249543fc6329b71e095e72d577" \
            "get_methods.php|pg_merchant_id=589160&pg_amount=5000&pg_currency=KZT&pg_testing_mode=1&pg_salt=r0dxjlp1t1&pg_sig=c0072a24efe50a7bc163622cc2d366f4" \
            "ps_list.php|pg_merchant_id=589160&pg_amount=5000&pg_currency=KZT&pg_testing_mode=1&pg_salt=ll21mjd1q3f&pg_sig=6a59a060ce104aed95a34280c343bbaa" ; do
            s="${pair%%|*}"; d="${pair#*|}"
            echo "===== $s ====="
            curl -sS -m 25 -w '\n[http=%{http_code}]\n' -X POST "https://api.freedompay.kz/$s" \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' --data "$d" | head -c 900
            echo
          done
