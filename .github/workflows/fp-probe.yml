name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Раздел «Тестовые карты» целиком
        run: |
          curl -sSL -m 60 "https://freedompay.kz/docs/merchant-api/pay" -o p.html
          tr -s '<>' '\n\n' < p.html | sed -n '12600,13000p' | sed '/^\s*$/d' | grep -vE '^(div|span|p|a|img|br|/|!|meta|link|script|style|button|li|ul|table|tr|td|th|h[1-6]|strong|em|b |i )' | head -220
