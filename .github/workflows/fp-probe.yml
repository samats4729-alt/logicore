name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Состояние выданного платежа (get_status)
        run: |
          curl -sS -m 30 -X POST 'https://api.freedompay.kz/get_status.php' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            --data 'pg_merchant_id=589160&pg_payment_id=1844430566&pg_salt=yl377l360a&pg_sig=2c571df78b2b19e4ba26c41770a0d5f6'
          echo

      - name: Состояние подробно (get_status2)
        run: |
          curl -sS -m 30 -X POST 'https://api.freedompay.kz/get_status2.php' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            --data 'pg_merchant_id=589160&pg_payment_id=1844430566&pg_salt=uaakg74ljk&pg_sig=0ff6f623ad865e7e20f8c2c10be0e91b'
          echo

      - name: Что показывает страница оплаты
        run: |
          curl -sS -m 30 -L -o page.html -w '[http=%{http_code} bytes=%{size_download}]\n' \
            'https://customer.freedompay.kz/pay.html?customer=01a06a7f-2c7b-72c2-a5a4-c272716fdad5&lang=ru' || true
          echo "--- признаки тестового режима ---"
          grep -o -i -E '.{0,60}(тестов|test mode|testing|demo).{0,60}' page.html | head -20 || echo "упоминаний теста нет"
          echo "--- заголовок ---"
          grep -o -i -E '<title>[^<]*</title>' page.html | head -3 || true
