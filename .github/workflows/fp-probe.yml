name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Карта сайта документации
        run: |
          for u in "https://freedompay.kz/sitemap.xml" "https://docs.freedompay.kz/sitemap.xml"; do
            echo "===== $u ====="
            curl -sSL -m 40 -w '[http=%{http_code} bytes=%{size_download}]\n' "$u" -o s.xml || true
            grep -o -E '<loc>[^<]+</loc>' s.xml 2>/dev/null | sed -E 's|</?loc>||g' | grep -iE 'doc|test|error|api' | head -60
          done

      - name: Текст страниц документации
        run: |
          for u in "https://freedompay.kz/docs/merchant-api/pay" "https://freedompay.kz/docs/gateway-api/error-list" "https://freedompay.kz/docs/gateway-api/test" "https://docs.freedompay.kz/info-32186131e0" "https://freedompay.kz/doc"; do
            echo "############ $u ############"
            curl -sSL -m 40 -w '[http=%{http_code} bytes=%{size_download}]\n' "$u" -o p.html || true
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/ /g' p.html 2>/dev/null | tr -s ' \t\n' ' ' > p.txt
            echo "--- длина текста: $(wc -c < p.txt) ---"
            grep -o -i -E '.{0,180}(тестов|10005|карточн|test card|Разработчик).{0,260}' p.txt | head -6
          done
