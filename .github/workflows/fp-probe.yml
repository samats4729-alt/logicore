name: FreedomPay probe

on:
  push:
    branches: [ claude/fp-probe ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --json > all.json || true

      - name: Разложить по приложениям
        run: |
          node -e "
          const a = (JSON.parse(require('fs').readFileSync('all.json','utf8')).advisories)||{};
          const ключи = Object.keys(a);
          console.log('Всего записей:', ключи.length);
          const образец = (a[ключи[0]].findings||[]).flatMap(f=>f.paths||[]).slice(0,3);
          console.log('Как выглядит путь:', JSON.stringify(образец));
          const по = {};
          const важные = new Set();
          for (const k of ключи) {
            const v = a[k];
            const пути = (v.findings||[]).flatMap(f => f.paths||[]);
            const где = new Set(пути.map(p => String(p).split('>')[0]));
            for (const g of где) {
              по[g] = по[g] || {};
              по[g][v.severity] = (по[g][v.severity]||0)+1;
              if ((v.severity==='critical'||v.severity==='high') && !/mobile/.test(g)) важные.add(g+' :: '+v.severity+' — '+v.module_name+' '+v.vulnerable_versions);
            }
          }
          for (const g of Object.keys(по).sort()) console.log(g + ':', JSON.stringify(по[g]));
          console.log('--- высокое и критическое вне мобильного ---');
          [...важные].sort().forEach(s => console.log('  ' + s));
          "
