name: API Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://build:build@localhost:5432/build"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Подписи статусов уже один раз разошлись по семи копиям — держим
      # словарь единым автоматически, а не на честном слове.
      - name: Check interface vocabulary
        run: node scripts/check-vocabulary.js

      - name: Build API
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: logcomp
          POSTGRES_PASSWORD: logcomp_secret
          POSTGRES_DB: logcomp
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Миграции применяются к чистой базе тем же способом, что и в проде
      # (prisma:deploy = prisma migrate deploy). Раньше здесь стоял костыль:
      # SQL одной миграции прогонялся на отдельной схеме с FK-заглушками,
      # потому что история не содержала baseline и воспроизвести базу с нуля
      # было нельзя. Теперь история начинается с 0_init и проверяется честно.
      - name: Apply migrations to a clean database
        env:
          DATABASE_URL: "postgresql://logcomp:logcomp_secret@localhost:5433/logcomp?schema=public"
        run: |
          pnpm --filter api prisma:generate
          pnpm --filter api prisma:deploy

      # Главная проверка перехода на Migrate: база, собранная ТОЛЬКО из
      # миграций, обязана совпадать со схемой. Расхождение означает, что
      # кто-то поменял schema.prisma без миграции — при деплое это привело бы
      # к молчаливому расхождению прода со схемой. --exit-code роняет шаг.
      - name: Verify migrations reproduce schema.prisma exactly
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://logcomp:logcomp_secret@localhost:5433/logcomp?schema=public"
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "✅ Схема и миграции совпадают" \
          || {
            echo "❌ База, собранная из миграций, не совпадает со схемой."
            echo "   Похоже, schema.prisma изменили без новой миграции."
            echo "   Создайте её: pnpm --filter api prisma:migrate"
            exit 1
          }

      - name: Seed reference data
        env:
          DATABASE_URL: "postgresql://logcomp:logcomp_secret@localhost:5433/logcomp?schema=public"
          SEED_TEST_DATA: "true"
        run: pnpm --filter api prisma:seed

      - name: Run Unit Tests (financial logic)
        run: pnpm --filter api test

      - name: Start API Server
        env:
          DATABASE_URL: "postgresql://logcomp:logcomp_secret@localhost:5433/logcomp?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-secret-key-at-least-64-characters-long-key-for-jwt-security-purposes"
          JWT_EXPIRES_IN: "7d"
          PORT: 3001
          NODE_ENV: development
        run: |
          pnpm dev:api &
          # Wait for API server to respond
          echo "Waiting for API server to start..."
          for i in {1..30}; do
            curl -sI http://localhost:3001/auth/me && break
            echo "Still waiting..."
            sleep 2
          done

      - name: Run Bruno Tests
        working-directory: tests/bruno
        run: |
          npx @usebruno/cli run --env local

  # Браузерные тесты веба (A-05). До них фронт не проверялся вовсе:
  # поломки интерфейса находил владелец, а не CI.
  e2e:
    name: Web smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: logcomp
          POSTGRES_PASSWORD: logcomp_secret
          POSTGRES_DB: logcomp
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://logcomp:logcomp_secret@localhost:5433/logcomp?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-secret-key-at-least-64-characters-long-key-for-jwt-security-purposes"
      JWT_EXPIRES_IN: "7d"
      PORT: 3001
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      E2E_BASE_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx prisma generate
          node prisma/seed-demo.js

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build and start API
        working-directory: apps/api
        run: |
          npx nest build
          node dist/main &
          for i in {1..40}; do
            curl -sf -o /dev/null http://localhost:3001/api/docs && break
            sleep 3
          done

      - name: Build and start web
        working-directory: apps/web
        run: |
          pnpm build
          pnpm start -p 3000 &
          for i in {1..40}; do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 3
          done

      - name: Run web smoke tests
        working-directory: apps/web
        run: pnpm e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
